[project]
name = "somfyProtect2Mqtt"
version = "2026.11.4"
description = "Somfy Home Alarm Addon"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aenum==3.1.17",
    "aiortc==1.16.0",
    "oauthlib==4.0.1",
    "paho-mqtt==2.2.0",
    "pillow==13.0.0",
    "python-ffmpeg-video-streaming==0.1.16",
    "pytz==2026.6",
    "pyyaml==6.0.3",
    "requests-oauthlib==2.0.0",
    "schedule==1.2.2",
    "simple-http-server==0.22.3",
    "urllib3==2.8.0",
    "websocket-client==1.9.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "black==26.10.1",
    "pylint==4.1.3",
    "isort==9.0.2",
]

[tool.uv]
package = false

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["somfyProtect2Mqtt/tests"]
pythonpath = ["somfyProtect2Mqtt"]
